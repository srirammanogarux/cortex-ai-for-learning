<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex · Onboarding Part B · Exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="explore.css">
  <link rel="stylesheet" href="map.css">
  <link rel="stylesheet" href="finale.css">
</head>
<body>
  <div class="page">
    <aside class="side">
      <p class="eyebrow">Prototype · Part B · PM path</p>
      <h2>Pondering</h2>
      <p>Sam picked “Why do some products become habits?”. Explore it, dive into glowing terms, zoom out with the map in the corner, and save what you explored.</p>
      <nav class="jump" id="jump" aria-label="Parts"></nav>
      <button class="replay" id="replay">↻ Replay Part B</button>
      <a class="toA" href="../">← Part A</a>
    </aside>

    <main id="phoneHolder">
      <div class="phone-wrap" id="phoneWrap">
        <div class="phone">
          <div class="island"></div>
          <div class="screen" id="screen">
            <div class="statusbar"><span>9:41</span><span aria-hidden="true" style="display:flex;gap:6px;align-items:center">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/></svg>
            </span></div>
            <!-- Layers (bottom → top). Each module owns its layer. -->
            <div class="layer" id="exploreLayer"></div>
            <div class="layer" id="mapLayer"></div>
            <div class="layer" id="finaleLayer"></div>
            <div class="layer toasts" id="toastLayer"></div>
          </div>
        </div>
      </div>
    </main>
    <aside class="side"></aside>
  </div>

  <canvas id="brain" style="display:none" aria-label="Cortex brain"></canvas>
  <script src="../brain.js"></script>
  <script src="../icons.js"></script>
  <script src="bus.js"></script>
  <script src="content.js"></script>
  <script src="explore.js"></script>
  <script src="map.js"></script>
  <script src="finale.js"></script>
  <script src="shell.js"></script>
</body>
</html>

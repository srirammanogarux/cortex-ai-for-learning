<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex · Onboarding (Work path)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <aside class="side">
      <p class="eyebrow">Prototype · Work path</p>
      <h2>Cortex onboarding</h2>
      <p>Click through it like a new user. Use the list to jump to any scene.</p>
      <nav class="jump" id="jump" aria-label="Scenes"></nav>
      <button class="replay" id="replay">↻ Replay from the start</button>
    </aside>

    <main id="phoneHolder">
      <div class="phone-wrap" id="phoneWrap">
        <div class="phone">
          <div class="island"></div>
          <div class="screen" id="screen">
            <div class="statusbar"><span>9:41</span><span aria-hidden="true" style="display:flex;gap:6px;align-items:center">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/></svg>
            </span></div>

            <div class="brain-wrap" id="brainWrap"><canvas id="brain" aria-label="Cortex brain. Touch it."></canvas></div>
            <div class="status" id="status" aria-live="polite"></div>
            <div class="mapviz" id="mapviz"><svg id="mapLines"></svg></div>
            <div class="ubub hide" id="ubub"></div>

            <div class="top" id="top">
              <button class="back" id="back" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
              <div class="progress" id="progress" aria-hidden="true"><span><i></i></span><span><i></i></span><span><i></i></span></div>
              <button class="skip" id="skip">Skip</button>
            </div>

            <div class="stage" id="stage"></div>

            <div class="cta hide" id="cta">
              <button class="btn" id="ctaBtn">Continue</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <aside class="side"></aside>
  </div>

  <script src="brain.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>

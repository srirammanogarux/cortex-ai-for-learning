<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex · Onboarding prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <aside class="panel left" id="personaPanel" aria-label="Personas"></aside>
    <main id="phoneHolder" style="position:relative">
      <div class="phone-wrap" id="phoneWrap">
        <div class="phone">
          <div class="island"></div>
          <div class="screen-root" id="screenRoot">
            <div class="statusbar" id="statusbar"><span>9:41</span><span class="sb-icons" aria-hidden="true">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.4 0 2.6.5 3.5 1.4l1.3-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.8 1.9l1.3 1.3c.9-.9 2.1-1.4 3.5-1.4zM8 9.4l1.9-1.9a2.7 2.7 0 0 0-3.8 0z"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>
            </span></div>
            <div class="brain-wrap" id="brainWrap"><canvas id="brain" aria-label="Cortex brain. Tap it."></canvas></div>
            <div class="brain-caption" id="brainCaption" aria-live="polite"></div>
            <div class="stage" id="stage"></div>
          </div>
        </div>
      </div>
    </main>
    <aside class="panel right" id="journeyPanel" aria-label="Journey"></aside>
  </div>

  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Seen</button>
    <button class="proto-picker-item">Ask</button>
    <button class="proto-picker-item">Wonder</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script src="brain.js"></script>
  <script src="data.js"></script>
  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
